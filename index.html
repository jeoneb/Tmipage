<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사물 TMI 위키</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#121212;color:#e6e6e6;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;padding:20px 16px 40px;display:flex;justify-content:center}
.wrap{width:100%;max-width:520px}
.card{background:#1e1e1e;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 4px 20px rgba(0,0,0,.5)}
h2{text-align:center;margin:0 0 16px;color:#fff}
h3{margin:0 0 12px;font-size:16px}
.row{display:flex;gap:8px}
.btn{flex:1;display:block;text-align:center;padding:13px 8px;background:#4CAF50;color:#fff;border-radius:8px;font-weight:bold;cursor:pointer;font-size:15px}
.btn:active{background:#43a047}
.btn input{display:none}
.ghost{background:transparent;border:1px solid #444;color:#aaa;border-radius:6px;padding:6px 10px;cursor:pointer;font-size:13px}
canvas{width:100%;border-radius:8px;margin-top:14px;display:none}
.wiki{background:#252526;border-left:4px solid #4CAF50;padding:14px;border-radius:0 8px 8px 0;line-height:1.7;font-size:14px;white-space:pre-wrap;margin-top:14px;display:none}
.note{font-size:12px;color:#888;text-align:center;margin-top:12px}
.item{display:flex;gap:12px;padding:10px 0;border-top:1px solid #333;cursor:pointer;align-items:center}
.item:first-of-type{border-top:0}
.item img{width:64px;height:64px;object-fit:cover;border-radius:8px;flex:none}
.item .t{flex:1;min-width:0}
.item b{display:block;font-size:15px}
.item span{font-size:12px;color:#888}
.empty{color:#888;font-size:14px;text-align:center;padding:8px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h2>📖 사물 TMI 위키</h2>
    <div class="row">
      <label class="btn">📷 사진 찍기<input type="file" id="cam" accept="image/*" capture="environment"></label>
      <label class="btn">🖼 사진 선택<input type="file" id="pick" accept="image/*"></label>
    </div>
    <canvas id="view"></canvas>
    <div id="out" class="wiki"></div>
    <div class="note" id="note">🧠 인식 모델 불러오는 중... (처음 한 번만 몇 초 걸려요)</div>
  </div>
  <div class="card">
    <h3>🗂 저장된 TMI <span id="count" style="color:#888;font-weight:normal"></span></h3>
    <div id="list"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<script>
/* =====================================================
   사물 사전  —  '영문클래스': [이름, 별명, 분류, 개요, [TMI 3개]]
   여기에 항목을 추가하면 문서가 늘어난다. (COCO-SSD 80종 클래스명 사용)
   ===================================================== */
const DB = {
'person':['사람','걸어다니는 물주머니','영장류 / 이 사진의 주인공','사진에 찍혔다는 것은 이 공간에 생명체가 있다는 뜻이다. 본 문서는 사물 위키이므로 신원은 따지지 않는다.',['성인의 뼈는 대략 206개다.','평균적으로 1분에 15~20번 눈을 깜빡인다고 한다.','몸의 절반 이상이 수분이다. 즉 물주머니 맞다.']],
'bicycle':['자전거','페달 달린 두 발의 연장','인력 이동수단','인간의 다리를 바퀴로 확장한 장치. 연료는 점심밥이다.',['페달 없이 발로 땅을 차던 1817년 카를 폰 드라이스의 발명품이 조상이다.','사람이 쓰는 에너지 대비 이동 효율이 가장 좋은 이동수단으로 자주 꼽힌다.','바람은 항상 가는 방향에서 불어온다. 돌아올 때도 그렇다.']],
'car':['자동차','바퀴 달린 철제 거실','내연/전기 이동수단','도로 위의 작은 사유지. 내비게이션과 부부싸움이 자주 일어나는 장소다.',['1886년 카를 벤츠가 특허를 낸 모터바겐이 최초의 자동차로 인정받는다.','자동차는 하루 대부분의 시간을 주차된 채로 보낸다는 조사가 많다.','주차는 구경꾼이 있을 때 유독 한 번에 안 된다.']],
'motorcycle':['오토바이','바람을 마시는 이륜차','이륜 이동수단','헬멧을 쓰고 타는 것이 상식이며, 안전 관련해서는 장난 없음.',['1885년 다임러의 라이트바겐이 최초의 내연기관 오토바이로 꼽힌다.','영어 motorcycle은 motor와 bicycle의 합성어다.','안전모는 선택이 아니라 필수다.']],
'bus':['버스','시민 이동 컨테이너','대중교통','기다릴 땐 안 오다가 두세 대가 한꺼번에 오는 것으로 유명하다.',['bus는 라틴어 omnibus(모두를 위한)의 줄임말이다.','벨을 누르는 순간 모두가 같은 정류장을 노린 것처럼 느껴진다.','마지막 줄 창가 자리는 은근히 명당이다.']],
'bench':['벤치','앉으라고 만든 긴 의자','공공시설','공원이나 정류장에 있는 다인용 좌석. 비둘기의 회의 장소이기도 하다.',['스포츠에서 후보 선수를 벤치 멤버라고 부르는 건 이 의자에서 유래했다.','앉자마자 폰을 꺼내는 사람이 90%라는 느낌적인 통계가 있다.','젖은 벤치는 앉기 전에는 절대 모른다.']],
'bird':['새','공룡의 후손','조류','학계 정설에 따르면 공룡의 한 갈래가 살아남아 진화한 존재다.',['새는 공룡의 후손으로 본다.','대부분의 새는 하루 종일 먹이를 찾느라 바쁘다.','사진 찍으려 하면 날아간다.']],
'cat':['고양이','액체 생명체','식육목 고양이과','집사를 부리는 것으로 알려진 생물. 상자만 보면 일단 들어간다.',['하루에 12~16시간 정도 잔다.','가르랑 소리는 만족뿐 아니라 긴장할 때도 낸다고 알려져 있다.','책상 위 물건을 떨어뜨리는 것은 직무에 가깝다.']],
'dog':['개','인류의 오랜 동반자','식육목 개과','주인이 집에 오면 세상이 끝났다 돌아온 듯 반기는 존재.',['개는 후각 수용체가 사람보다 수십 배 많다.','꼬리 흔드는 방향에 따라 감정이 다르다는 연구가 있다.','산책 단어를 철자로 말하면 알아듣는다는 설이 있다(카더라).']],
'backpack':['배낭','등 위의 이동식 서랍','가방','분명 가볍게 챙겼는데 어깨는 무겁다. 이 모순의 원인은 대개 노트북이다.',['가장 필요한 물건은 항상 맨 밑에 있다.','어깨끈 길이는 짐 무게에 반비례해 짧아진다 (느낌).','가방 안 이어폰은 반드시 엉켜 있다.']],
'umbrella':['우산','손에 드는 작은 지붕','우비류','비를 막으려 만든 도구지만 사용 직후 가장 먼저 놓고 오는 물건 1순위다.',['원래 비가 아니라 햇빛을 가리는 용도로 고대에 쓰였다.','우산은 비 오는 날 지하철에 두고 내릴 확률이 높다.','맑아지면 짐이 된다.']],
'handbag':['핸드백','작은 수납 왕국','가방','손으로 들거나 어깨에 거는 가방. 안에는 세상 모든 영수증이 있다.',['가방 속에서 열쇠를 찾는 시간은 늘 예상보다 길다.','한 번 들어가면 안 나오는 물건이 반드시 있다.','내용물 무게는 외관과 무관하다.']],
'bottle':['병','액체 보관 전문가','용기','음료나 물을 담는 용기. 한 번 열면 닫는 건 항상 느린 법이다.',['PET병은 1973년 너새니얼 와이어스가 특허를 낸 것으로 알려져 있다.','병뚜껑은 평소엔 단단한데 급할 땐 안 열린다.','분리수거 라벨 제거는 의외로 난이도가 있다.']],
'wine glass':['와인잔','다리 달린 유리컵','식기','발이 길쭉한 잔. 우아함 비용이 포함된 가격이다.',['손 체온이 와인에 전달되지 않게 다리(스템)를 잡도록 만든 구조다.','잔을 부딪칠 때 소리가 가장 듣기 좋은 순간이 가장 위험하다.','투명하지만 들고 있으면 괜히 없어 보이지 않는다.']],
'cup':['컵','손에 쥐는 작은 호수','식기','음료를 담는 기본 도구. 책상 위에서 가장 자주 엎질러지는 물건이다.',['손잡이는 뜨거운 음료를 들기 위한 발명품이다.','컵은 항상 컴퓨터 옆에 있다. 그것도 엎질러지기 가장 좋은 위치에.','머그컵을 모으기 시작하면 장식장이 모자라게 된다.']],
'fork':['포크','찌르기 전문 식기','식기','음식을 찍어 먹기 위한 도구. 젓가락 문화권에서는 서브 장비다.',['유럽에서 널리 쓰이게 된 건 비교적 늦은 시기로 알려져 있다.','처음엔 포크 쓰는 걸 사치스럽다고 비난한 기록이 있다.','면 요리에서 포크는 늘 빙글빙글 돈다.']],
'knife':['칼','절단 전담 도구','식기 / 조리도구','베기 위한 도구인 만큼 안전하게 다뤄야 한다.',['식탁용 칼 끝이 둥근 것은 17세기 프랑스 추기경 일화에서 비롯됐다고 전해진다.','칼은 날이 무딜수록 더 위험하다는 말이 있다.','조리 중 칼을 달라고 하면 손부터 확인하자.']],
'spoon':['숟가락','가장 오래된 식사 도구 중 하나','식기','국물 요리 전담. 밥, 국, 아이스크림 모두 담당한다.',['숟가락은 가장 오래된 식사 도구 중 하나로 꼽힌다.','한국에서는 숟가락으로 밥을 먹는 것이 일상이다.','밥보다 먼저 올라오는 건 대개 숟가락과 젓가락이다.']],
'bowl':['그릇','음식의 집','식기','밥이든 국이든 일단 담고 본다. 설거지 대기 순위 1위다.',['그릇은 토기 시절부터 인류와 함께한 도구다.','큰 그릇 하나가 작은 그릇 여러 개보다 설거지가 편하다는 설이 있다.','마지막 한 숟갈이 가장 안 떠진다.']],
'banana':['바나나','노란색 휴대용 간식','과일','껍질을 까기만 하면 되는 완벽한 휴대 식량.',['식물학적으로 바나나는 베리류에 속한다. 딸기는 아니다.','칼륨-40 덕분에 아주 약한 방사선을 낸다.','껍질을 밟으면 미끄러진다는 건 만화의 국룰이다.']],
'apple':['사과','하루 한 개의 의사 대체재','과일','장미과 식물의 열매. 지구상에서 가장 많이 먹히는 과일 중 하나다.',['사과는 장미과에 속한다.','사과 속 씨앗은 소량의 시안화물을 함유하지만 먹는 정도로는 문제되지 않는다.','깎아두면 갈색으로 변하는 건 산화 때문이다.']],
'orange':['오렌지','색 이름의 원조','과일','오렌지색을 정하는 데 기준이 된 과일. 색 이름이 먼저일 것 같지만 과일이 먼저다.',['영어에서 오렌지색 이름은 과일 이름에서 유래했다.','껍질 속 하얀 부분은 먹어도 된다.','까는 데 성공하면 이상하게 뿌듯하다.']],
'pizza':['피자','원형 탄수화물 접시','양식','치즈와 토핑을 얹은 구운 반죽. 나눠 먹을수록 조각 크기를 두고 눈치 게임이 시작된다.',['마르게리타 피자는 1889년 나폴리에서 왕비를 위해 만들어졌다고 전해진다.','조각 수는 사람 수보다 항상 한 개 모자라다.','식으면 맛이 떨어지지만 다음 날 먹는 피자도 나름의 매력이 있다.']],
'cake':['케이크','생일의 필수품','디저트','촛불 부는 의식을 위한 달콤한 단상.',['생일 케이크에 초를 꽂는 풍습의 유래는 여러 설이 있다.','케이크는 분리수거가 안 되는 마음을 담는다.','가장 큰 조각은 늘 누군가의 눈치와 맞바꿔진다.']],
'chair':['의자','엉덩이의 안식처','가구','앉기 위한 가구. 사람은 의자에 앉은 시간만큼 안 일어난다.',['등받이 있는 의자는 고대 이집트 시대 유물에서도 발견된다.','오래 앉아있는 것은 건강에 안 좋다는 연구가 많다.','발 올리고 앉는 자세는 누구나 한 번쯤 해봤다.']],
'couch':['소파','인간 고정 장치','가구','한 번 앉으면 일어나기 어려운 현대인의 블랙홀.',['영어 couch는 프랑스어 coucher(눕다)에서 유래했다.','소파 틈에는 동전과 리모컨이 산다.','낮잠이 목적이라면 소파는 최고의 침대다.']],
'potted plant':['화분','실내 초록 담당','식물','집에 두면 분위기가 살아나고 물을 안 주면 시들어서 죄책감도 준다.',['식물은 낮에 광합성으로 산소를 내보낸다.','NASA 공기정화 연구는 밀폐 실험실 조건이라 일반 방에선 효과가 미미하다는 반론이 있다.','잘 키우는 비결은 존재를 잊지 않는 것이다.']],
'bed':['침대','하루의 시작과 끝','가구','사람이 인생의 약 3분의 1을 보내는 장소로 알려져 있다.',['사람은 인생의 3분의 1 정도를 잔다고 한다.','일어나려는 순간이 가장 힘든 순간이다.','이불 밖은 위험하다는 건 과학적 사실이다 (아마도).']],
'dining table':['식탁','밥상의 본진','가구','밥도 먹고 일도 하고 택배 뜯는 다용도 플랫폼.',['식탁 위 물건은 서서히 쌓여 결국 밥 먹을 공간만 남는다.','가족이 모이는 장소로 쓰이는 경우가 많다.','식탁 위 다용도 공간은 늘 포화 상태다.']],

const GENERIC = n => [n,'정체를 파악 중인 사물','미분류','이 위키에는 아직 이 사물의 정식 문서가 없다. 편집자가 채워주길 기다리는 중이다.',['인식은 되었으나 TMI 문서는 아직 작성되지 않았다.','이 문서를 채우는 방법은 코드의 DB 객체에 항목을 추가하는 것이다.','어쩌면 당신이 이 사물에 대한 세계 최초의 위키 편집자가 될 수 있다.']];

/* ---------- 저장소 ---------- */
const KEY = 'tmiWiki.local.v1';
const $ = id => document.getElementById(id);
function load(){ try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch(e){ return []; } }
function save(arr){
  while (arr.length){ try { localStorage.setItem(KEY, JSON.stringify(arr)); return true; } catch(e){ arr.pop(); } }
  try { localStorage.removeItem(KEY); } catch(e){}
  return false;
}
function esc(s){ return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function render(t){ $('out').style.display = 'block'; $('out').innerHTML = esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'); }

function renderList(){
  const arr = load(), box = $('list');
  $('count').textContent = arr.length ? '(' + arr.length + ')' : '';
  box.innerHTML = '';
  if (!arr.length){ box.innerHTML = '<div class="empty">아직 저장된 기록이 없어요</div>'; return; }
  arr.forEach(it => {
    const d = document.createElement('div'); d.className = 'item';
    d.innerHTML = '<img alt=""><div class="t"><b></b><span></span></div><button class="ghost">🗑</button>';
    d.querySelector('img').src = it.thumb;
    d.querySelector('b').textContent = it.title;
    d.querySelector('span').textContent = new Date(it.at).toLocaleString('ko-KR');
    d.onclick = () => {
      const c = $('view'), im = new Image();
      im.onload = () => { c.width = im.width; c.height = im.height; c.getContext('2d').drawImage(im, 0, 0); c.style.display = 'block'; };
      im.src = it.thumb; render(it.text); window.scrollTo({ top: 0, behavior: 'smooth' });
    };
    d.querySelector('button').onclick = e => {
      e.stopPropagation();
      if (confirm('이 기록을 삭제할까요?')){ save(load().filter(x => x.id !== it.id)); renderList(); }
    };
    box.appendChild(d);
  });
}

/* ---------- 환경 분석 (밝기 / 색감) ---------- */
function envInfo(cv){
  const s = document.createElement('canvas'); s.width = s.height = 32;
  const x = s.getContext('2d'); x.drawImage(cv, 0, 0, 32, 32);
  const d = x.getImageData(0, 0, 32, 32).data; let r = 0, g = 0, b = 0, n = d.length / 4;
  for (let i = 0; i < d.length; i += 4){ r += d[i]; g += d[i+1]; b += d[i+2]; }
  r /= n; g /= n; b /= n;
  const lum = Math.round((0.299*r + 0.587*g + 0.114*b) / 255 * 100);
  const mx = Math.max(r,g,b), mn = Math.min(r,g,b), sat = mx ? (mx-mn)/mx : 0;
  let h = 0; const df = mx - mn;
  if (df){ if (mx === r) h = ((g-b)/df + 6) % 6; else if (mx === g) h = (b-r)/df + 2; else h = (r-g)/df + 4; h *= 60; }
  let color = '무채색 계열';
  if (sat > 0.15) color = h < 20 || h >= 340 ? '붉은 계열' : h < 50 ? '주황빛 계열' : h < 70 ? '노란 계열' : h < 165 ? '초록 계열' : h < 200 ? '청록 계열' : h < 260 ? '푸른 계열' : '보랏빛 계열';
  const light = lum < 25 ? '매우 어둡다. 야행성 감성 또는 조명 절약 모드.' : lum < 50 ? '아늑한 편이다. 눈이 편안한 정도.' : lum < 75 ? '적당히 밝다. 사진 찍기 좋은 환경.' : '매우 밝다. 선글라스가 필요할 수 있다.';
  return { lum, color, light };
}

/* ---------- 분석 ---------- */
let model = null, busy = false;
cocoSsd.load().then(m => { model = m; $('note').textContent = '✅ 준비 완료! 사진을 찍어보세요. 분석 결과는 자동 저장돼요.'; })
  .catch(() => { $('note').textContent = '❌ 인식 모델을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.'; });

async function toCanvas(file, max, canvas){
  const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
  const r = Math.min(1, max / Math.max(bmp.width, bmp.height));
  canvas.width = Math.round(bmp.width * r); canvas.height = Math.round(bmp.height * r);
  canvas.getContext('2d').drawImage(bmp, 0, 0, canvas.width, canvas.height);
}

async function onPick(e){
  const f = e.target.files[0]; e.target.value = '';
  if (!f || busy) return;
  if (!model){ $('note').textContent = '⏳ 모델 로딩 중이에요. 잠시 후 다시 시도해 주세요.'; return; }
  busy = true;
  try {
    const cv = $('view'); await toCanvas(f, 800, cv); cv.style.display = 'block';
    const tc = document.createElement('canvas'); await toCanvas(f, 480, tc);
    const thumb = tc.toDataURL('image/jpeg', 0.7);
    $('out').style.display = 'block'; $('out').textContent = '🔍 사물의 영혼과 TMI를 스캔하는 중...';
    const env = envInfo(cv);
    const preds = (await model.detect(cv, 12, 0.4)).sort((a, b) => b.score * b.bbox[2] * b.bbox[3] - a.score * a.bbox[2] * a.bbox[3]);
    const ctx = cv.getContext('2d');
    ctx.lineWidth = Math.max(2, cv.width / 250); ctx.font = 'bold ' + Math.max(14, cv.width / 38) + 'px sans-serif';
    preds.forEach(p => {
      const [x, y, w, h] = p.bbox, nm = (DB[p.class] || [p.class])[0];
      ctx.strokeStyle = '#4CAF50'; ctx.strokeRect(x, y, w, h);
      ctx.fillStyle = '#4CAF50'; const tw = ctx.measureText(nm).width + 8;
      ctx.fillRect(x, y, tw, parseInt(ctx.font) + 6); ctx.fillStyle = '#fff'; ctx.fillText(nm, x + 4, y + parseInt(ctx.font) + 1);
    });
    const main = preds[0];
    let text = '';
    if (main){
      const e = DB[main.class] || GENERIC(main.class);
      text += `**[${e[0]}]** (${e[1]})\n**분류:** ${e[2]}\n**개요:** ${e[3]}\n**TMI & 잡다한 지식:**\n` + e[4].map((t, i) => `${i+1}. ${t}`).join('\n') + '\n';
      text += `**인식 신뢰도:** ${Math.round(main.score * 100)}%\n`;
    } else {
      text += `**[정체불명의 무언가]** (사물 위키도 모르는 것)\n**분류:** 미확인 사물\n**개요:** 80종의 사물을 아는 위키 AI가 알아보지 못했다. 이 사진에는 신비로운 기운이 감돈다.\n**TMI:** 더 가까이서, 밝은 곳에서 다시 찍으면 인식률이 올라간다.\n`;
    }
    const others = {}; preds.slice(main ? 1 : 0).forEach(p => { const n = (DB[p.class] || [p.class])[0]; others[n] = (others[n] || 0) + 1; });
    const ol = Object.entries(others).map(([n, c]) => c > 1 ? `${n} ${c}개` : n).join(', ');
    text += `**주변 환경 관찰:**\n- 밝기 ${env.lum}% — ${env.light}\n- 전체 색감: ${env.color}\n- 함께 발견된 사물: ${ol || '없음 (미니멀리스트의 공간이다)'}`;
    render(text);
    const m = text.match(/\*\*\[(.+?)\]\*\*/);
    const arr = load(); arr.unshift({ id: Date.now().toString(36), at: Date.now(), title: m ? m[1] : '기록', text, thumb });
    $('note').textContent = save(arr) ? '✅ 저장 완료!' : '⚠️ 저장 공간이 부족해 저장하지 못했어요.';
    renderList();
  } catch(err){
    $('out').textContent = '❌ 분석에 실패했어요. 다른 사진으로 다시 시도해 주세요.';
  } finally { busy = false; }
}
$('cam').addEventListener('change', onPick);
$('pick').addEventListener('change', onPick);
renderList();
</script>
